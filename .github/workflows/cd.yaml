name: CD

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: ["dev", "main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: self-hosted

    steps:
      - name: Checkout branch tip (includes release commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Kube sanity
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl get nodes

      - name: Install ArgoCD CLI (if missing)
        shell: bash
        run: |
          set -euo pipefail
          if command -v argocd >/dev/null 2>&1; then
            argocd version --client
            exit 0
          fi
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
          esac
          curl -sSL -o /tmp/argocd "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-${ARCH}"
          chmod +x /tmp/argocd
          sudo mv /tmp/argocd /usr/local/bin/argocd
          argocd version --client

      - name: Login to ArgoCD
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Uses token-based auth; --grpc-web often needed behind ingress/proxy setups
          argocd login "$ARGOCD_SERVER" --insecure --grpc-web --auth-token "$ARGOCD_AUTH_TOKEN"
          argocd account get-user-info

      - name: Upsert Application (GitOps: ArgoCD pulls from this repo)
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Expecting an app manifest in repo (recommended):
          # argocd/application.yaml
          if [ ! -f argocd/application.yaml ]; then
            echo "Missing argocd/application.yaml"
            exit 1
          fi
          argocd app create -f argocd/application.yaml --upsert

      - name: Sync & wait healthy
        shell: bash
        run: |
          set -euo pipefail
          APP="$(yq -r '.metadata.name' argocd/application.yaml 2>/dev/null || true)"
          if [ -z "${APP:-}" ] || [ "$APP" = "null" ]; then
            # fallback if yq isn't installed: hardcode app name in manifest or set APP here
            APP="sample-nodejs"
          fi
          argocd app sync "$APP" --prune --timeout 300
          argocd app wait "$APP" --health --timeout 300

