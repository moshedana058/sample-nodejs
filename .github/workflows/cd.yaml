name: CD

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: ["dev", "main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via ArgoCD
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted

    steps:
      - name: Checkout branch tip (includes release commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Kube sanity
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl get nodes

      - name: Install ArgoCD CLI (if missing)
        shell: bash
        run: |
          set -euo pipefail
          if command -v argocd >/dev/null 2>&1; then
            argocd version --client
            exit 0
          fi

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "Unsupported arch: $ARCH" ; exit 1 ;;
          esac

          curl -sSL -o /tmp/argocd "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-${ARCH}"
          chmod +x /tmp/argocd
          sudo mv /tmp/argocd /usr/local/bin/argocd
          argocd version --client

      - name: Validate ArgoCD secrets + connectivity (no secrets printed)
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${ARGOCD_SERVER:-}" ]] || { echo "ERROR: ARGOCD_SERVER secret is empty"; exit 1; }
          [[ -n "${ARGOCD_AUTH_TOKEN:-}" ]] || { echo "ERROR: ARGOCD_AUTH_TOKEN secret is empty"; exit 1; }

          echo "Using ARGOCD_SERVER=${ARGOCD_SERVER}"
          # If your ArgoCD is HTTP (no TLS), this should return 200 with HTML
          curl -sS -m 3 -v "http://${ARGOCD_SERVER}/" >/dev/null

      - name: ArgoCD auth check (stateless token)
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          argocd --server "${ARGOCD_SERVER}" --grpc-web --plaintext \
            --auth-token "${ARGOCD_AUTH_TOKEN}" account get-user-info

      - name: Upsert Application (GitOps:ArgoCD pulls from this repo)
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -f argocd/application.yaml
          argocd --server "${ARGOCD_SERVER}" --grpc-web --plaintext \
            --auth-token "${ARGOCD_AUTH_TOKEN}" app create -f argocd/application.yaml --upsert

      - name: Sync & wait healthy
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          APP="sample-nodejs"
          argocd --server "${ARGOCD_SERVER}" --grpc-web --plaintext \
            --auth-token "${ARGOCD_AUTH_TOKEN}" app sync "${APP}" --prune --timeout 300
          argocd --server "${ARGOCD_SERVER}" --grpc-web --plaintext \
            --auth-token "${ARGOCD_AUTH_TOKEN}" app wait "${APP}" --health --timeout 300

