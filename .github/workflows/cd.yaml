name: CD

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: ["dev", "main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted]

    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Ensure argocd CLI exists
        shell: bash
        run: |
          set -euo pipefail
          if command -v argocd >/dev/null 2>&1; then
            argocd version --client
            exit 0
          fi
          sudo curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo chmod +x /usr/local/bin/argocd
          argocd version --client

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ARGOCD_SERVER:-}" ] || (echo "Missing ARGOCD_SERVER secret" && exit 1)
          [ -n "${ARGOCD_AUTH_TOKEN:-}" ] || (echo "Missing ARGOCD_AUTH_TOKEN secret" && exit 1)

      - name: Pick app name + revision
        id: app
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "name=sample-nodejs" >> "$GITHUB_OUTPUT"
            echo "rev=main" >> "$GITHUB_OUTPUT"
          else
            echo "name=sample-nodejs-dev" >> "$GITHUB_OUTPUT"
            echo "rev=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert ArgoCD application (Helm from this repo)
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.name }}"
          REV="${{ steps.app.outputs.rev }}"
          REPO="https://github.com/${{ github.repository }}.git"

          # --grpc-web is usually required behind HTTP ingress
          argocd app create "$APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure \
            --upsert \
            --repo "$REPO" \
            --revision "$REV" \
            --path charts/sample-nodejs \
            --dest-server https://kubernetes.default.svc \
            --dest-namespace sample-nodejs \
            --sync-policy automated \
            --self-heal \
            --auto-prune

      - name: Sync + wait healthy
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.name }}"

          argocd app sync "$APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

          argocd app wait "$APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure \
            --health \
            --operation \
            --timeout 300

          argocd app get "$APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

